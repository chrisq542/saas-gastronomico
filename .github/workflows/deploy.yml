name: Deploy SaaS

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  deploy:
    name: Deploy SaaS Gastronómico to VPS
    runs-on: ubuntu-latest

    steps:
      - name: Deploy via SSH to VPS
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USERNAME }}
          key: ${{ secrets.VPS_SSH_KEY }}
          password: ${{ secrets.VPS_PASSWORD }}
          port: ${{ secrets.VPS_PORT || 22 }}
          script: |
            set -e
            echo "🚀 Iniciando despliegue en VPS..."

            # Cargar nvm/node en caso de que la sesión SSH no lo detecte por defecto
            export NVM_DIR="$HOME/.nvm"
            [ -s "$NVM_DIR/nvm.sh" ] && \. "$NVM_DIR/nvm.sh"

            # Directorio y puerto asignado a esta app
            APP_DIR="${{ secrets.VPS_TARGET_DIR || '/var/www/saas-gastronomico' }}"
            APP_NAME="saas-gastronomico"
            APP_PORT="3000" # Cambia este puerto según la app (ej: 3001, 3002)

            # Crear directorio objetivo con permisos si no existe
            if [ ! -d "$APP_DIR" ]; then
              sudo mkdir -p "$APP_DIR" 2>/dev/null || mkdir -p "$APP_DIR"
              sudo chown -R $(whoami):$(whoami) "$APP_DIR" 2>/dev/null || true
            fi
            cd "$APP_DIR"

            # Si el directorio está vacío / no es repositorio git, clonar
            if [ ! -d ".git" ]; then
              echo "⚙️ Inicializando repositorio en el VPS..."
              git clone https://github.com/${{ github.repository }}.git .
            fi

            echo "📥 Actualizando código desde Git..."
            git fetch origin
            git reset --hard origin/${{ github.ref_name }}

            # Crear .env desde .env.example si aún no existe en el servidor
            if [ ! -f ".env" ]; then
              echo "📄 .env no encontrado en el servidor. Creando copia desde .env.example..."
              cp .env.example .env
            elif ! grep -q "DIRECT_URL" .env; then
              echo "DIRECT_URL=\"\$DATABASE_URL\"" >> .env
            fi

            # Asegurar variables de Resend para recuperación de contraseña en VPS
            if [ -n "${{ secrets.RESEND_API_KEY }}" ]; then
              if grep -q "RESEND_API_KEY" .env; then
                sed -i 's/^RESEND_API_KEY=.*/RESEND_API_KEY="${{ secrets.RESEND_API_KEY }}"/' .env
              else
                echo "RESEND_API_KEY=\"${{ secrets.RESEND_API_KEY }}\"" >> .env
              fi
            fi
            if ! grep -q "RESEND_FROM_EMAIL" .env; then
              echo "RESEND_FROM_EMAIL=\"seguridad@afxapp.cl\"" >> .env
            fi

            # Asegurar número de pruebas y WhatsApp oficial
            if grep -q "NEXT_PUBLIC_RESTAURANT_WHATSAPP" .env; then
              sed -i 's/^NEXT_PUBLIC_RESTAURANT_WHATSAPP=.*/NEXT_PUBLIC_RESTAURANT_WHATSAPP="56967249014"/' .env
            else
              echo 'NEXT_PUBLIC_RESTAURANT_WHATSAPP="56967249014"' >> .env
            fi
            if grep -q "NEXT_PUBLIC_RESTAURANT_PHONE" .env; then
              sed -i 's/^NEXT_PUBLIC_RESTAURANT_PHONE=.*/NEXT_PUBLIC_RESTAURANT_PHONE="56967249014"/' .env
            else
              echo 'NEXT_PUBLIC_RESTAURANT_PHONE="56967249014"' >> .env
            fi

            echo "📦 Instalando dependencias de forma segura..."
            # Evita que npm ci borre agresivamente node_modules mientras la app está corriendo
            if ! npm install --prefer-offline --no-audit; then
              echo "⚠️ Inconsistencia detectada en node_modules. Limpiando de forma segura y reintentando..."
              rm -rf node_modules
              npm install --no-audit
            fi

            echo "🗄️ Generando Prisma Client y sincronizando base de datos..."
            npx prisma generate
            npx prisma db push --skip-generate

            echo "🏗️ Compilando Next.js..."
            npm run build

            echo "🔄 Recargando aplicación en PM2 en el puerto $APP_PORT..."
            if pm2 describe "$APP_NAME" > /dev/null 2>&1; then
              # Intenta recarga suave sin tiempo de inactividad; si falla ejecuta restart
              pm2 reload "$APP_NAME" --update-env || pm2 restart "$APP_NAME" --update-env
            else
              pm2 start npm --name "$APP_NAME" -- start -- -p "$APP_PORT"
            fi

            echo "💾 Guardando estado de PM2..."
            pm2 save

            echo "✅ ¡Despliegado con éxito PAPUUUUUUUUU!"  